# Runs the offline test suite and linters on every push and pull request.
# No device access is needed: the tests work from synthetic capture files.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt ruff yamllint
      - run: ruff check .
      - run: yamllint .
      - run: python3 -m pytest tests/ -q
