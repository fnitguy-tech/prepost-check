# Runs the offline test suite and linters on every push and pull request.
# No device access is needed: the tests work from synthetic capture files.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Proves the documented Python floor: runtime deps + tests only, since the
  # pinned dev tools may not publish wheels for older interpreters.
  test-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt pytest
      - run: python3 -m pytest tests/ -q

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: yamllint .
      - run: python3 -m pytest tests/ -q
