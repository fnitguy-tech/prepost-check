# Lint config. Rules are scoped here so `ruff check .` is the pass/fail
# gate for this repo regardless of any machine-wide ruff settings.
line-length = 120

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors
    "F",               # pyflakes
    "I",               # import sorting
    "SIM",             # simplifications
]
