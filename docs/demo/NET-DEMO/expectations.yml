# Expected BGP prefix deltas for the NET-DEMO window (fictional).
#
# Written by hand before or during the change, next to the captures:
#   reports/<TICKET>/expectations.yml   (picked up by scripts/compare.py)
# or anywhere, passed with --expectations. One entry per device + peer:
#
#   device:             capture hostname (case-insensitive)
#   peer:               neighbor IP or the Description column of
#                       "show ip bgp summary" (PAN-OS: the peer name)
#   expected_delta:     change in prefixes received (+3, -200, 0), or
#   expected_prefixes:  absolute prefixes received in the postcheck
#   note:               optional, shown in the finding
#
# A delta that matches is rated Stable ("as planned"); one that differs,
# or has no entry here, is Attention; an entry whose change did not
# happen is Attention too.
ticket: NET-DEMO
expectations:
  - device: SITE-A-SW-2
    peer: 10.0.0.1
    expected_delta: +3
    note: SITE-A-SW-1 re-advertises the three ISP-B transit prefixes over iBGP
